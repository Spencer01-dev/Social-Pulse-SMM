<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <!-- Favicons -->
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="shortcut icon" href="/favicon.ico" />

    <!-- Open Graph / Facebook & Meta Ads Default (Social Pulse) -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="SocialPulse | Wholesale SMM Platform" />
    <meta property="og:description" content="Wholesale Social Media Marketing Reseller and Child Panel SaaS Platform." />
    <meta property="og:image" content="https://www.socialpulsesmm.com/socialpulse-logo.png" />
    <meta property="og:url" content="https://www.socialpulsesmm.com" />

    <!-- Twitter / X Card Default -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="SocialPulse | Wholesale SMM Platform" />
    <meta name="twitter:description" content="Wholesale Social Media Marketing Reseller and Child Panel SaaS Platform." />
    <meta name="twitter:image" content="https://www.socialpulsesmm.com/socialpulse-logo.png" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Wholesale Social Media Marketing Reseller and Child Panel SaaS Platform." />
    
    <!-- Preconnect to Backend API and CDNs -->
    <link rel="preconnect" href="https://social-pulse-smm-0geu.onrender.com" />
    <link rel="dns-prefetch" href="https://social-pulse-smm-0geu.onrender.com" />
    <link rel="preconnect" href="https://www.googletagmanager.com" />
    <link rel="dns-prefetch" href="https://www.googletagmanager.com" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="anonymous" />
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" media="print" onload="this.media='all'">
    <noscript>
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap">
    </noscript>
    <title>SocialPulse | Wholesale SMM Platform</title>

    <!-- Early domain detection: dynamically switches branding for child panel visitors in the browser -->
    <script>
      (function() {
        var h = location.hostname.toLowerCase().split(':')[0].replace(/^www\./, '');
        var mainDomains = ['socialpulse.io','socialpulsesmm.com','social-pulse-smm.vercel.app','social-pulse-smm.onrender.com','social-pulse-smm-0geu.onrender.com','localhost','127.0.0.1'];
        var isMain = mainDomains.indexOf(h) !== -1;
        var params = new URLSearchParams(window.location.search);
        var tenantParam = params.get('tenant') || (window.sessionStorage ? sessionStorage.getItem('active_tenant_domain') : null);
        var isChildPanel = !isMain || Boolean(tenantParam);

        var ogTitle = document.querySelector('meta[property="og:title"]');
        var ogDesc = document.querySelector('meta[property="og:description"]');
        var ogImg = document.querySelector('meta[property="og:image"]');
        var twTitle = document.querySelector('meta[name="twitter:title"]');
        var twDesc = document.querySelector('meta[name="twitter:description"]');
        var twImg = document.querySelector('meta[name="twitter:image"]');

        if (isChildPanel) {
          var target = (tenantParam || h).toLowerCase().replace(/^www\./, '');
          var brand = 'Skakegains SMM';
          if (target.indexOf('skakegains') !== -1 || target.indexOf('shakegains') !== -1) {
            brand = 'Skakegains SMM';
          } else {
            var b = target.split('.')[0];
            brand = b.charAt(0).toUpperCase() + b.slice(1) + ' SMM';
          }
          var pageTitle = brand + ' | Premium SMM Panel';
          document.title = pageTitle;
          document.documentElement.style.setProperty('--tenant-accent', '#10b981');
          document.documentElement.style.setProperty('--tenant-accent-rgb', '16, 185, 129');
          document.documentElement.setAttribute('data-tenant-active', 'true');
          
          var logoPath = '/skakegains-logo.png';
          var earlyIcons = document.querySelectorAll("link[rel*='icon'], link[rel='apple-touch-icon'], link[rel='shortcut icon']");
          earlyIcons.forEach(function(el) { el.href = logoPath; });

          var fullLogoUrl = window.location.origin + logoPath;
          var childDesc = 'Order at our website ' + target + ' for cheapest and fastest social media growth services.';
          if (ogTitle) ogTitle.setAttribute('content', pageTitle);
          if (ogDesc) ogDesc.setAttribute('content', childDesc);
          if (ogImg) ogImg.setAttribute('content', fullLogoUrl);
          if (twTitle) twTitle.setAttribute('content', brand);
          if (twDesc) twDesc.setAttribute('content', childDesc);
          if (twImg) twImg.setAttribute('content', fullLogoUrl);
        } else {
          document.title = 'SocialPulse | Wholesale SMM Platform';
        }
      })();
    </script>
  </head>
  <body class="bg-[#0B0F19] text-slate-100 font-sans antialiased selection:bg-brand-500 selection:text-white min-h-screen">
    <!-- Meta Pixel noscript fallback -->
    <noscript>
      <img height="1" width="1" style="display:none"
           src="https://www.facebook.com/tr?id=%VITE_META_PIXEL_ID%&ev=PageView&noscript=1"
           alt="" />
    </noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
